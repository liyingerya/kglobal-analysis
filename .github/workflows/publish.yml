name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example, v0.1.0)'
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve exact release tag
        id: source
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          build_ref="refs/tags/$RELEASE_TAG"
          git check-ref-format "$build_ref"
          printf 'ref=%s\n' "$build_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install build frontend
        run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Validate wheel and source distribution
        run: |
          python scripts/check_release.py --wheel dist/*.whl
          python scripts/check_release.py --sdist dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kglobal-analysis/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
