[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kglobal-analysis"
version = "0.1.0"
description = "KGlobal case metadata and lazy dimension-aware movie reconstruction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "xarray>=2024.7.0", "dask[array]>=2024.7.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]
